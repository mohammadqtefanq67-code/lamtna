<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لمتنا | إضافة عرض</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,Tahoma,sans-serif;color:#171717}
.wrap{max-width:620px;margin:auto;padding:18px}.head{background:#111;color:#fff;padding:22px;border-radius:20px;margin-bottom:16px}
h1{margin:0 0 7px}.muted{color:#777;line-height:1.6}.head p{margin:0;color:#ddd}
.card{background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin:14px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}
textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:800;background:#111;color:#fff;margin-top:17px}
button:disabled{opacity:.5}.msg{padding:13px;border-radius:12px;margin-top:12px;line-height:1.7;display:none}.ok{background:#eaf8ee;color:#17652d}.err{background:#fff0f0;color:#9d2222}
.preview{width:100%;max-height:300px;object-fit:cover;border-radius:15px;display:none;margin-top:12px}.link{word-break:break-all;background:#f4f4f4;padding:12px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>لمتنا — إضافة عرض 🛍️</h1>
    <p>أدخل بيانات المنتج، وبعد النشر تحصل على رابط مباشر. رقم واتساب يُحفظ للتواصل معك عند تجهيز الطلبات.</p>
  </div>

  <div class="card">
    <label>اسم المنتج</label>
    <input id="name" placeholder="مثال: ملابس أطفال">

    <label>وصف مختصر</label>
    <textarea id="description" placeholder="اكتب وصفاً بسيطاً للمنتج"></textarea>

    <label>رابط صورة المنتج</label>
    <input id="image" placeholder="https://..." oninput="previewImage()">
    <img id="preview" class="preview">

    <label>السعر العادي (د.أ)</label>
    <input id="normal" type="number" min="0" step="0.01" placeholder="10">

    <label>سعر التجمع (د.أ)</label>
    <input id="group" type="number" min="0" step="0.01" placeholder="8">

    <label>عدد الأشخاص المطلوب</label>
    <input id="required" type="number" min="2" value="5">

    <label>رقم واتساب التاجر</label>
    <input id="sellerWhatsapp" type="tel" inputmode="tel" placeholder="مثال: 9627XXXXXXXX">

    <button id="publish" onclick="publishProduct()">نشر العرض</button>
    <div id="message" class="msg"></div>
  </div>

  <div id="result" class="card" style="display:none">
    <h3>تم إنشاء العرض 🎉</h3>
    <div class="muted">رابط المنتج المباشر:</div>
    <div id="productLink" class="link"></div>
    <button onclick="copyLink()">نسخ رابط المنتج</button>
    <button onclick="copyInstagramPost()">نسخ منشور Instagram جاهز</button>
    <button id="sellerWhatsappBtn" onclick="openSellerWhatsapp()" style="display:none">فتح واتساب التاجر</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://sufrioumvpsgmnbvccou.supabase.co";
const SUPABASE_KEY="sb_publishable_UjrdEmpkrgsd_tV30Cd0UA_CkR4FBoY";
const SELLER_ID="f6072a42-ebdf-4b62-990d-a961054b5be4";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lastProduct=null;
let lastSellerWhatsapp="";

function previewImage(){
  const url=document.getElementById("image").value.trim(), img=document.getElementById("preview");
  if(url){img.src=url;img.style.display="block"}else img.style.display="none";
}
function msg(t,ok){
  const m=document.getElementById("message");m.innerHTML=t;m.className="msg "+(ok?"ok":"err");m.style.display="block";
}
async function publishProduct(){
  const btn=document.getElementById("publish");
  const name=document.getElementById("name").value.trim();
  const description=document.getElementById("description").value.trim();
  const image_url=document.getElementById("image").value.trim()||null;
  const normal=Number(document.getElementById("normal").value);
  const group=Number(document.getElementById("group").value);
  const required=Number(document.getElementById("required").value);
  const sellerWhatsapp=document.getElementById("sellerWhatsapp").value.trim().replace(/[^0-9]/g,"");

  if(!name || !Number.isFinite(normal) || !Number.isFinite(group) || !Number.isInteger(required) || required<2){
    msg("تأكد من اسم المنتج والأسعار وعدد الأشخاص.",false);return;
  }
  if(group>normal){msg("سعر التجمع يجب أن يكون أقل أو مساويًا للسعر العادي.",false);return}
  if(sellerWhatsapp.length < 10){msg("أدخل رقم واتساب التاجر بصيغة دولية، مثال 9627XXXXXXXX.",false);return}

  btn.disabled=true;btn.textContent="جاري نشر العرض...";
  // Save the seller WhatsApp on the seller record through a small prototype RPC.
  // This keeps the number out of the public product record.
  const {error:phoneError}=await db.rpc("set_test_seller_whatsapp",{p_phone:sellerWhatsapp});
  if(phoneError){
    msg("تعذر حفظ رقم واتساب التاجر: "+phoneError.message,false);
    btn.disabled=false;btn.textContent="نشر العرض";return;
  }

  const {data,error}=await db.from("products").insert({
    seller_id:SELLER_ID,name,description,image_url,
    normal_price:normal,group_price:group,required_members:required,status:"active"
  }).select("id").single();

  if(error){
    msg("تعذر نشر العرض: "+error.message,false);
    btn.disabled=false;btn.textContent="نشر العرض";return;
  }

  // Create the first open group; customers will join it by governorate through join_group.
  const {error:groupError}=await db.from("groups").insert({
    product_id:data.id,required_members:required,current_members:0,status:"open"
  });
  if(groupError){
    msg("تم إنشاء المنتج لكن تعذر إنشاء التجمع الأول: "+groupError.message,false);
    btn.disabled=false;btn.textContent="نشر العرض";return;
  }

  const link=location.origin+location.pathname.replace(/[^/]*$/,"")+"lamtna-index.html?product="+data.id;
  lastProduct={id:data.id,name,description,image_url,normal,group,required};
  lastSellerWhatsapp=sellerWhatsapp;
  document.getElementById("productLink").textContent=link;
  document.getElementById("sellerWhatsappBtn").style.display="block";
  document.getElementById("result").style.display="block";
  msg("تم نشر العرض بنجاح 🎉 — بعد تفعيل Meta سنحوّل هذا الزر إلى نشر مباشر على Instagram.",true);
  btn.textContent="تم النشر ✓";
}
async function copyLink(){
  const link=document.getElementById("productLink").textContent;
  try{await navigator.clipboard.writeText(link);msg("تم نسخ الرابط.",true)}catch(e){alert(link)}
}
async function copyInstagramPost(){
  if(!lastProduct) return;
  const link=document.getElementById("productLink").textContent;
  const text=`🔥 ${lastProduct.name}\n\nالسعر العادي: ${lastProduct.normal} د.أ\nسعر التجمع: ${lastProduct.group} د.أ\nالتجمع يحتاج ${lastProduct.required} أشخاص\n\nانضم من الرابط: ${link}\n\n#لمتنا #تجمعات`;
  try{await navigator.clipboard.writeText(text);msg("تم نسخ نص منشور Instagram الجاهز.",true)}catch(e){alert(text)}
}
function openSellerWhatsapp(){
  if(!lastSellerWhatsapp) return;
  const text=encodeURIComponent("مرحباً، تم إنشاء عرض جديد على لمتنا. أريد متابعة طلبات هذا العرض عبر واتساب.");
  window.open("https://wa.me/"+lastSellerWhatsapp+"?text="+text,"_blank");
}
</script>
</body>
</html>
